[package]
name = "valkyrie"
version = "0.1.0"
edition = "2024"
author = ["Alyx Shang <alyxshang@alyxshang.boo>"]
license-file = "LICENSE"
readme = "README.markdown"
description= "A lightweight, decentralized, censorship-free social media platform."
homepage = "https://github.com/alyxshang/valkyrie"
repository = "https://github.com/alyxshang/valkyrie"

[dependencies]
rand = "0.10.3"
sha256 = "1.6.0"
bcrypt = "0.19.3"
chrono = "0.4.45"
actix-cors = "0.7.2"
actix-web = "4.18.1"
env_logger = "0.11.11"
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls"] }

[dev-dependencies]
serial_test = "4.0.1"

[profile.release]
lto = true
strip = true
panic = "abort"
opt-level = "z"
codegen-units = 1
